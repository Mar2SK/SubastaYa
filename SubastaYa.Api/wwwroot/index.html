<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SubastaYa es una plataforma de subastas online en tiempo real para explorar productos, realizar pujas y participar de subastas de forma segura.">
    <title>SubastaYa</title>
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/catalog.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">SubastaYa</a>

        <nav class="navigation">
            <a href="/" class="active">Explorar</a>
        
            <div id="guest-navigation" class="auth-navigation hidden">
                <a href="/login.html" class="login-button">
                    Iniciar sesión
                </a>
            </div>
        
            <div id="authenticated-navigation" class="auth-navigation hidden">
                <a href="/profile.html">Mi cuenta</a>
                <a href="activities.html">Mis actividades</a>
                <a href="/publish.html">Publicar subasta</a>
        
                <button type="button" onclick="logout()">
                    Cerrar sesión
                </button>
            </div>
        </nav>
    </header>

    <main class="page-container" data-sys-render="auto">
        <section class="hero">
            <p class="eyebrow">SUBASTAS EN TIEMPO REAL</p>
            <h1>Encontrá algo único.</h1>
            <p>
                Explorá publicaciones, seguí las pujas y ofertá
                con saldo garantizado.
            </p>
        </section>

        <section class="toolbar">
            <label>
                Estado
                <select id="status-filter">
                    <option value="">Todas</option>
                    <option value="ACTIVA">Activas</option>
                    <option value="PROGRAMADA">Próximas</option>
                    <option value="FINALIZADA">Finalizadas</option>
                    <option value="DESIERTA">Desiertas</option>
                </select>
            </label>

            <label>
                Categoría
                <select id="category-filter">
                    <option value="">Todas</option>
                </select>
            </label>

            <label>
                Precio mínimo
                <input id="minimum-price-filter" type="number" min="0">
            </label>

            <label>
                Precio máximo
                <input id="maximum-price-filter" type="number" min="0">
            </label>

            <label>
                Ordenar por
                <select id="order-filter">
                    <option value="menor-tiempo">Menor tiempo restante</option>
                    <option value="mayor-puja">Mayor puja</option>
                </select>
            </label>

            <button id="apply-filters-button" type="button">
                Aplicar filtros
            </button>
        </section>

        <section>
            <div class="section-heading">
                <div>
                    <p class="eyebrow">CATÁLOGO</p>
                    <h2>Subastas disponibles</h2>
                </div>

                <span id="auction-count" class="auction-count"></span>
            </div>

            <div id="loading-message" class="message">
                Cargando subastas...
            </div>

            <div id="error-message" class="message error hidden">
            </div>

            <div id="auction-grid" class="auction-grid"></div>
        </section>
    </main>

    <script src="/js/auth.js"></script>
    <script src="js/catalog.js"></script>
</body>
</html>
