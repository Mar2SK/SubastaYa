<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa - Login</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <main data-sys-render="auto" class="login-container">
        <section class="login-card">
            <h1>SubastaYa</h1>
            <p>Iniciá sesión para participar en subastas.</p>

            <form id="loginForm">
                <label for="email">Email</label>
                <input type="email"
                       id="email"
                       name="email"
                       required
                       autocomplete="email">

                <label for="password">Contraseña</label>
                <input type="password"
                       id="password"
                       name="password"
                       required
                       autocomplete="current-password">

                <button type="submit" id="loginButton">
                    Iniciar sesión
                </button>

                <p id="loginError" class="error-message"></p>
            </form>

            <p>
                ¿No tenés cuenta?
                <a href="/register.html">Registrate</a>
            </p>
        </section>
    </main>

    <script src="/js/login.js"></script>
</body>
</html>
